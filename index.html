<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>STAR DEFENDER</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050508;--cy:#00c8ff;--gr:#00ff88;--pk:#ff0055;--tx:#c8e6f0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050508;--tx:#c8e6f0}}
:root[data-theme="dark"]{--bg:#050508;--tx:#c8e6f0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Orbitron','Noto Sans Bengali',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative}
canvas{width:100%;height:100%;display:block;background:#02030a;border:1px solid rgba(0,200,255,.3);border-radius:10px;box-shadow:0 0 30px rgba(0,200,255,.15)}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;background:rgba(2,3,10,.84);border-radius:10px}
h1{margin:0;font-size:clamp(26px,8vw,40px);font-weight:900;letter-spacing:.1em;background:linear-gradient(135deg,var(--cy),var(--gr));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 10px var(--cy))}
#msg{font-size:13px;line-height:1.8;color:var(--tx);opacity:.85}
button{font-family:inherit;font-weight:700;font-size:15px;letter-spacing:.15em;color:var(--cy);background:transparent;border:2px solid var(--cy);border-radius:6px;padding:12px 34px;cursor:pointer;transition:box-shadow .2s}
button:hover{box-shadow:0 0 22px rgba(0,200,255,.6)}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050508">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STAR DEFENDER">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="wrap">
  <canvas id="g"></canvas>
  <div id="ov"><h1 id="title">STAR DEFENDER</h1><div id="msg"></div><button id="btn">START</button></div>
</div>
<script>
'use strict';
const GAME_NAME='STAR DEFENDER'; // এখানে নিজের গেমের নাম দাও
document.getElementById('title').textContent=GAME_NAME;
document.title=GAME_NAME;
const W=480,H=720;
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
const wrap=document.getElementById('wrap'),ov=document.getElementById('ov'),msg=document.getElementById('msg'),btn=document.getElementById('btn');
function fit(){const s=Math.min(document.body.clientWidth/W,document.body.clientHeight/H)*.98;wrap.style.width=W*s+'px';wrap.style.height=H*s+'px'}
fit();addEventListener('resize',fit);

let state='menu',score=0,lives=3,level=1,hi=0,t=0,spawnT=0,shake=0,banner=0,tx=null,ty=null;
try{hi=+localStorage.getItem('sd_hi')||0}catch(e){}
let P,bullets=[],enemies=[],ebul=[],parts=[],pups=[];
const keys={};
const stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,v:20+Math.random()*80,r:Math.random()*1.4+.3}));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

msg.innerHTML='টাচ বা মাউস দিয়ে জাহাজ সরাও — অটো ফায়ার<br>কীবোর্ড: ← ↑ ↓ → অথবা WASD<br>⚡ = র‍্যাপিড ফায়ার &nbsp; ♥ = এক্সট্রা লাইফ';

function reset(){
  score=0;lives=3;level=1;t=0;shake=0;banner=1.6;spawnT=.5;tx=null;
  bullets=[];enemies=[];ebul=[];parts=[];pups=[];
  P={x:W/2,y:H-100,cool:0,inv:1,rapid:0};
}
function start(){reset();state='play';ov.style.display='none'}
btn.onclick=start;

addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if((e.code==='Enter'||e.code==='Space')&&state!=='play')start();
});
addEventListener('keyup',e=>{keys[e.code]=false});
function setTarget(e){const r=cv.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*W;ty=(e.clientY-r.top)/r.height*H-50}
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}setTarget(e)});
cv.addEventListener('pointermove',e=>{if(state==='play')setTarget(e)});

function shoot(){
  bullets.push({x:P.x,y:P.y-22,vx:0,vy:-640});
  if(P.rapid>0){bullets.push({x:P.x-12,y:P.y-12,vx:-60,vy:-620});bullets.push({x:P.x+12,y:P.y-12,vx:60,vy:-620})}
}
function explode(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=40+Math.random()*190;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+Math.random()*.5,c})}}
function spawn(){
  const r=Math.random();let k=0;
  if(level>=2&&r>.72)k=1;else if(level>=3&&r>.5)k=2;
  const e={x:30+Math.random()*(W-60),y:-30,type:k,ph:Math.random()*6,fire:1+Math.random(),vx:0};
  if(k===0)Object.assign(e,{hp:1,vy:90+level*9,r:15,val:10});
  if(k===1)Object.assign(e,{hp:4,vy:50+level*3,r:22,val:40});
  if(k===2){Object.assign(e,{hp:1,vy:200+level*10,r:13,val:20});e.vx=(P.x-e.x)/((P.y+30)/e.vy)}
  enemies.push(e);
}
function hitPlayer(){
  if(P.inv>0)return;
  lives--;P.inv=1.6;shake=.4;explode(P.x,P.y,'#00c8ff',26);
  if(lives<=0)gameOver();
}
function gameOver(){
  state='over';explode(P.x,P.y,'#ff6b35',50);
  if(score>hi){hi=score;try{localStorage.setItem('sd_hi',String(hi))}catch(e){}}
  document.getElementById('title').textContent='GAME OVER';
  msg.innerHTML='স্কোর: <b style="color:var(--gr)">'+score+'</b> &nbsp;|&nbsp; হাই স্কোর: <b style="color:var(--cy)">'+hi+'</b><br>লেভেল '+level;
  btn.textContent='আবার খেলো';
  setTimeout(()=>{ov.style.display='flex'},700);
}

function updateStars(dt){for(const s of stars){s.y+=s.v*dt*(1+level*.05);if(s.y>H){s.y=0;s.x=Math.random()*W}}}
function update(dt){
  t+=dt;
  let mx=0,my=0;
  if(keys.ArrowLeft||keys.KeyA)mx--;if(keys.ArrowRight||keys.KeyD)mx++;
  if(keys.ArrowUp||keys.KeyW)my--;if(keys.ArrowDown||keys.KeyS)my++;
  if(mx||my){tx=null;P.x+=mx*330*dt;P.y+=my*330*dt}
  else if(tx!==null){const k=Math.min(1,14*dt);P.x+=(tx-P.x)*k;P.y+=(ty-P.y)*k}
  P.x=clamp(P.x,20,W-20);P.y=clamp(P.y,H*.3,H-30);
  P.inv=Math.max(0,P.inv-dt);P.rapid=Math.max(0,P.rapid-dt);shake=Math.max(0,shake-dt);banner=Math.max(0,banner-dt);
  P.cool-=dt;if(P.cool<=0){shoot();P.cool=P.rapid>0?.12:.24}

  level=1+Math.floor(score/600);
  spawnT-=dt;if(spawnT<=0){spawnT=Math.max(.35,1.1-level*.07);spawn()}

  for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt}
  for(const b of ebul){b.x+=b.vx*dt;b.y+=b.vy*dt}
  for(const e of enemies){
    e.y+=e.vy*dt;
    if(e.type===0)e.x+=Math.sin(t*3+e.ph)*80*dt;
    if(e.type===2)e.x+=e.vx*dt;
    if(e.type===1){e.fire-=dt;if(e.fire<=0){e.fire=1.7;ebul.push({x:e.x,y:e.y+20,vx:0,vy:240})}}
    e.x=clamp(e.x,12,W-12);
  }
  for(const p of pups)p.y+=100*dt;
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}

  // bullets vs enemies
  for(const b of bullets){
    for(const e of enemies){
      if(e.dead||b.dead)continue;
      if(dist(b,e)<e.r+4){
        b.dead=true;e.hp--;explode(b.x,b.y,'#ffd60a',4);
        if(e.hp<=0){
          e.dead=true;score+=e.val;explode(e.x,e.y,e.type===1?'#8b5cf6':'#ff0055',18);
          if(Math.random()<.1)pups.push({x:e.x,y:e.y,k:Math.random()<.5?'R':'H'});
        }
      }
    }
  }
  // enemies / bullets vs player
  for(const e of enemies){if(!e.dead&&dist(e,P)<e.r+13){e.dead=true;explode(e.x,e.y,'#ff0055',16);hitPlayer()}}
  for(const b of ebul){if(!b.dead&&dist(b,P)<14){b.dead=true;hitPlayer()}}
  for(const p of pups){
    if(dist(p,P)<26){p.dead=true;if(p.k==='R')P.rapid=8;else lives=Math.min(5,lives+1);explode(p.x,p.y,'#00ff88',10)}
  }
  bullets=bullets.filter(b=>!b.dead&&b.y>-20&&b.x>-20&&b.x<W+20);
  ebul=ebul.filter(b=>!b.dead&&b.y<H+20);
  enemies=enemies.filter(e=>!e.dead&&e.y<H+40);
  pups=pups.filter(p=>!p.dead&&p.y<H+20);
  parts=parts.filter(p=>p.l>0);
}

function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*24,(Math.random()-.5)*shake*24);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#02030a');g.addColorStop(1,'#0a0f24');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  ctx.fillStyle='#a0dcff';
  for(const s of stars){ctx.globalAlpha=.3+s.r/2.2;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill()}
  ctx.globalAlpha=1;

  if(state!=='menu'&&P){
    // bullets
    ctx.shadowBlur=10;ctx.shadowColor='#00ff88';ctx.fillStyle='#00ff88';
    for(const b of bullets)ctx.fillRect(b.x-2,b.y-9,4,16);
    ctx.shadowColor='#ff0055';ctx.fillStyle='#ff4d88';
    for(const b of ebul){ctx.beginPath();ctx.arc(b.x,b.y,5,0,6.283);ctx.fill()}
    // enemies
    for(const e of enemies){
      ctx.save();ctx.translate(e.x,e.y);
      if(e.type===0){ctx.shadowColor='#ff0055';ctx.fillStyle='#ff0055';ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(15,0);ctx.lineTo(0,15);ctx.lineTo(-15,0);ctx.closePath();ctx.fill()}
      if(e.type===1){ctx.shadowColor='#8b5cf6';ctx.fillStyle='#8b5cf6';ctx.fillRect(-20,-14,40,28);ctx.fillStyle='#050508';ctx.fillRect(-14,-8,28*(e.hp/4),16)}
      if(e.type===2){ctx.shadowColor='#ffd60a';ctx.fillStyle='#ffd60a';ctx.beginPath();ctx.moveTo(-13,-12);ctx.lineTo(13,-12);ctx.lineTo(0,14);ctx.closePath();ctx.fill()}
      ctx.restore();
    }
    // powerups
    ctx.font='700 16px Orbitron, monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    for(const p of pups){
      ctx.shadowColor='#00ff88';ctx.strokeStyle='#00ff88';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,13,0,6.283);ctx.stroke();
      ctx.fillStyle='#00ff88';ctx.fillText(p.k==='R'?'⚡':'♥',p.x,p.y+1);
    }
    // particles
    ctx.shadowBlur=0;
    for(const p of parts){ctx.globalAlpha=Math.max(0,p.l*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3)}
    ctx.globalAlpha=1;
    // ship
    if(state==='play'){
      ctx.save();ctx.translate(P.x,P.y);
      if(P.inv>0&&Math.floor(t*20)%2)ctx.globalAlpha=.35;
      ctx.shadowColor='#00c8ff';ctx.shadowBlur=14;ctx.fillStyle='#00c8ff';
      ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(16,16);ctx.lineTo(0,9);ctx.lineTo(-16,16);ctx.closePath();ctx.fill();
      ctx.fillStyle='#ff6b35';ctx.beginPath();ctx.moveTo(-5,12);ctx.lineTo(0,22+Math.random()*8);ctx.lineTo(5,12);ctx.fill();
      ctx.restore();
    }
    // HUD
    ctx.shadowBlur=0;ctx.textBaseline='alphabetic';ctx.font='700 14px Orbitron, monospace';
    ctx.textAlign='left';ctx.fillStyle='#00c8ff';ctx.fillText('SCORE '+score,14,28);
    ctx.fillStyle='#c8e6f0';ctx.fillText('LV '+level,14,50);
    ctx.textAlign='right';ctx.fillStyle='#ffd60a';ctx.fillText('HI '+Math.max(hi,score),W-14,28);
    ctx.fillStyle='#ff0055';ctx.fillText('♥'.repeat(Math.max(0,lives)),W-14,50);
    if(P.rapid>0){ctx.textAlign='center';ctx.fillStyle='#00ff88';ctx.fillText('⚡ RAPID '+Math.ceil(P.rapid),W/2,28)}
    if(banner>0&&state==='play'){ctx.textAlign='center';ctx.globalAlpha=Math.min(1,banner);ctx.fillStyle='#00ff88';ctx.font='900 30px Orbitron, monospace';ctx.fillText('LEVEL '+level,W/2,H/2-60);ctx.globalAlpha=1}
  }
  ctx.restore();
}

let last=0,lvPrev=1;
function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  updateStars(dt);
  if(state==='play'){update(dt);if(level!==lvPrev){banner=1.6;lvPrev=level}}
  else if(state==='over'){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);shake=Math.max(0,shake-dt)}
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
