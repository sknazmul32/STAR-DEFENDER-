<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXUS ARCADE</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050508">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050508;--panel:#0b0d1a;--cy:#00c8ff;--gr:#00ff88;--pk:#ff0055;--tx:#c8e6f0;--dim:#5a8fa8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050508;--panel:#0b0d1a;--tx:#c8e6f0}}
:root[data-theme="dark"]{--bg:#050508;--panel:#0b0d1a;--tx:#c8e6f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Orbitron','Noto Sans Bengali',system-ui,sans-serif;min-height:100vh}
.w{max-width:960px;margin:0 auto;padding:24px 16px 50px}
header{text-align:center;margin-bottom:22px}
h1{margin:0;font-size:clamp(28px,8vw,52px);font-weight:900;letter-spacing:.12em;background:linear-gradient(135deg,var(--cy),var(--gr));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 12px var(--cy))}
.sub{font-size:11px;color:var(--dim);letter-spacing:.25em;margin-top:6px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
#q{flex:1;min-width:160px;background:#02030a;border:1px solid rgba(0,200,255,.25);border-radius:8px;padding:11px 14px;color:var(--tx);font-family:inherit;font-size:13px;outline:none}
#q:focus{border-color:var(--cy)}
.chip{background:transparent;border:1px solid rgba(0,200,255,.25);border-radius:20px;padding:8px 14px;color:var(--dim);font-family:inherit;font-size:11px;letter-spacing:.1em;cursor:pointer}
.chip.on{color:var(--cy);border-color:var(--cy);background:rgba(0,200,255,.08)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid rgba(0,200,255,.18);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 0 22px rgba(0,200,255,.25)}
.ic{font-size:42px}.nm{font-size:15px;font-weight:700;letter-spacing:.06em}
.tag{align-self:flex-start;font-size:9px;letter-spacing:.15em;color:var(--gr);border:1px solid rgba(0,255,136,.4);border-radius:4px;padding:2px 8px}
.ds{font-size:12px;color:var(--dim);line-height:1.6;flex:1}.hs{font-size:11px;color:#ffd60a}
.play{display:block;text-align:center;text-decoration:none;color:var(--cy);border:2px solid var(--cy);border-radius:6px;padding:10px;font-weight:700;font-size:12px;letter-spacing:.2em}
.play:hover{box-shadow:0 0 18px rgba(0,200,255,.5)}
.ad{margin:22px 0;min-height:90px;border:1px dashed rgba(0,200,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:10px;letter-spacing:.3em}
.vpn{background:linear-gradient(135deg,#0d0020,#130028);border:1px solid rgba(255,0,85,.35);border-radius:10px;padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.vpn b{font-size:13px;color:#fff}.vpn a{color:var(--pk);border:1px solid var(--pk);border-radius:5px;padding:8px 12px;font-size:10px;letter-spacing:.1em;text-decoration:none;margin-left:6px}
footer{text-align:center;margin-top:26px;font-size:11px;color:var(--dim)}footer a{color:var(--cy)}
.none{grid-column:1/-1;text-align:center;color:var(--dim);padding:30px;font-size:13px}
</style>
</head>
<body>
<div class="w">
  <header>
    <h1 id="brand">NEXUS ARCADE</h1>
    <div class="sub">FREE BROWSER GAMES — NO LOGIN, NO INSTALL</div>
  </header>
  <div class="bar">
    <input id="q" type="search" placeholder="গেম খোঁজো…" autocomplete="off">
    <div id="chips"></div>
  </div>
  <div id="grid"></div>

  <!-- AdSense বিজ্ঞাপনের কোড এই বক্সের ভেতরে বসাবে -->
  <div class="ad">ADVERTISEMENT</div>

  <div class="vpn">
    <b>🛡 অনলাইনে প্রাইভেসি চাও?</b>
    <span>
      <!-- নিজের affiliate লিংক দিয়ে # বদলাও -->
      <a href="#" target="_blank" rel="noopener">GET NORDVPN</a>
      <a href="#" target="_blank" rel="noopener">GET EXPRESSVPN</a>
    </span>
  </div>

  <footer>© <span id="yr"></span> <span id="brand2">NEXUS ARCADE</span> · <a href="privacy.html">Privacy Policy</a></footer>
</div>
<script>
'use strict';
const SITE_NAME='NEXUS ARCADE'; // পোর্টালের নাম এখানে বদলাও
// নতুন গেম যোগ করতে এই লিস্টে একটা লাইন বাড়াও
const GAMES=[
 {n:'STAR DEFENDER',u:'star-defender.html',c:'Action',i:'🚀',d:'এলিয়েনদের ঠেকাও, লেভেল বাড়াও, পাওয়ার-আপ ধরো।',k:'sd_hi',l:'হাই স্কোর'},
 {n:'NEON SNAKE',u:'snake.html',c:'Arcade',i:'🐍',d:'খাবার খেয়ে বড় হও, নিজের গায়ে লেগো না।',k:'snk_hi',l:'হাই স্কোর'},
 {n:'MEMORY MATCH',u:'memory.html',c:'Puzzle',i:'🧠',d:'কার্ড উল্টে কম চালে সব জোড়া মেলাও।',k:'mem_best',l:'সেরা চাল'}
];
document.title=SITE_NAME;document.getElementById('brand').textContent=SITE_NAME;document.getElementById('brand2').textContent=SITE_NAME;
document.getElementById('yr').textContent=new Date().getFullYear();
let cat='All';
const cats=['All',...new Set(GAMES.map(g=>g.c))];
const chips=document.getElementById('chips'),grid=document.getElementById('grid'),q=document.getElementById('q');
function best(k){try{return localStorage.getItem(k)}catch(e){return null}}
function render(){
  chips.innerHTML='';
  cats.forEach(c=>{const b=document.createElement('button');b.className='chip'+(c===cat?' on':'');b.textContent=c.toUpperCase();b.onclick=()=>{cat=c;render()};chips.appendChild(b)});
  const s=q.value.trim().toLowerCase();
  const list=GAMES.filter(g=>(cat==='All'||g.c===cat)&&(!s||g.n.toLowerCase().includes(s)));
  grid.innerHTML=list.length?'':'<div class="none">কোনো গেম পাওয়া যায়নি</div>';
  list.forEach(g=>{
    const v=best(g.k),el=document.createElement('div');el.className='card';
    el.innerHTML='<div class="ic">'+g.i+'</div><div class="nm">'+g.n+'</div><span class="tag">'+g.c.toUpperCase()+'</span><div class="ds">'+g.d+'</div>'+(v?'<div class="hs">'+g.l+': '+v+'</div>':'')+'<a class="play" href="'+g.u+'">▶ PLAY</a>';
    grid.appendChild(el);
  });
}
q.addEventListener('input',render);render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
